<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Το Κουδούνι Χτύπησε! · Escape Room · Στο Γυμνάσιο</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a4458; --h1:#8e7cc3; --sub:#a88bcf; --muted:#b3a7c9;
  --purple:#8e7cc3; --purple-d:#6d5b87; --purple-bg:#f7eef9;
  --blue:#7aa6b9; --blue-d:#3f6d82; --blue-bg:#e9f1f7;
  --green:#6fae84; --green-d:#3f7a54; --green-bg:#eaf6ee;
  --rose:#c98bb0; --rose-d:#9c5980; --rose-bg:#fbeef5;
  --gold:#c6a75e; --gold-d:#8f7536; --gold-bg:#faf4e4;
  --lav:#ece3f7; --lav2:#f7f2fc; --wine:#8e4a73;
}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--lav2);
  background-image:radial-gradient(circle at 15% 10%,#fff 0,transparent 40%),radial-gradient(circle at 85% 90%,#f3e8fb 0,transparent 45%);min-height:100vh}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--h1);font-size:22px;letter-spacing:.5px}
.brand small{display:block;font-family:Nunito;font-weight:600;font-size:12px;color:var(--muted);letter-spacing:1px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{border:1.5px solid var(--lav);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.tbtn:hover{border-color:var(--sub)}
.tbtn.on{background:var(--purple);color:#fff;border-color:var(--purple)}
h1{font-family:'Cormorant Garamond',serif;color:var(--h1);font-size:46px;margin:6px 0 2px;line-height:1.05}
h2{font-family:'Cormorant Garamond',serif;font-size:32px;margin:0 0 4px}
.subtitle{color:var(--sub);font-weight:700;margin:0 0 14px}
.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 6px 24px rgba(110,90,150,.10);border:1px solid #efe6f8}
.en{color:#8a8398;font-size:14px;font-style:italic}
.btn{border:none;border-radius:14px;padding:12px 22px;font-weight:800;font-size:17px;color:#fff;background:var(--purple);box-shadow:0 4px 0 var(--purple-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--purple-d)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d)}
.center{text-align:center}
/* backpack */
.pack{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px dashed var(--muted);border-radius:16px;padding:10px 14px;margin:14px 0}
.pack b{font-size:14px}
.slot{min-width:84px;text-align:center;padding:6px 10px;border-radius:10px;background:var(--lav2);border:1.5px solid var(--lav);font-weight:800;letter-spacing:1px;color:var(--muted)}
.slot.got{background:var(--gold-bg);border-color:var(--gold);color:var(--gold-d)}
/* map */
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.door{position:relative;border:none;border-radius:20px;padding:18px 14px 16px;text-align:left;color:var(--ink);min-height:150px;
  box-shadow:0 5px 0 rgba(0,0,0,.08);transition:transform .15s}
.door:not([disabled]):hover{transform:translateY(-3px)}
.door[disabled]{cursor:not-allowed;filter:grayscale(.75);opacity:.6}
.door .num{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:700;line-height:1}
.door .name{font-weight:800;font-size:17px;margin-top:6px}
.door .task{font-size:13px;margin-top:4px;opacity:.85}
.door .badge{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center}
.c1{background:var(--green-bg);border:2px solid var(--green)} .c1 .num{color:var(--green-d)}
.c2{background:var(--purple-bg);border:2px solid var(--purple)} .c2 .num{color:var(--purple-d)}
.c3{background:var(--rose-bg);border:2px solid var(--rose)} .c3 .num{color:var(--rose-d)}
.c4{background:var(--blue-bg);border:2px solid var(--blue)} .c4 .num{color:var(--blue-d)}
.c5{background:var(--gold-bg);border:2px solid var(--gold)} .c5 .num{color:var(--gold-d)}
/* room */
.roomhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.back{background:none;border:none;color:var(--sub);font-weight:800;font-size:15px}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--lav)}
.dot.done{background:var(--acc,var(--purple))}
.dot.now{outline:2px solid var(--acc,var(--purple));outline-offset:2px}
.play{width:96px;height:96px;border-radius:50%;border:none;background:var(--acc,var(--purple));color:#fff;display:grid;place-items:center;margin:8px auto 4px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.play:active{transform:translateY(3px)}
.mini{background:var(--lav2);border:1.5px solid var(--lav);border-radius:999px;padding:6px 12px;font-weight:700;color:var(--ink);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:16px}
.opt{background:#fff;border:2px solid var(--lav);border-radius:14px;padding:14px;font-size:18px;font-weight:700;color:var(--ink);transition:all .12s}
.opt:hover:not([disabled]){border-color:var(--acc,var(--purple));background:var(--lav2)}
.opt.ok{background:var(--green-bg);border-color:var(--green);color:var(--green-d)}
.opt.no{background:#fdf0f0;border-color:#e2a5a5;color:#a35a5a;opacity:.75}
.reveal{min-height:34px;margin-top:12px;font-size:22px;font-weight:800;text-align:center;color:var(--acc)}
.q{font-size:24px;font-weight:700;text-align:center;line-height:1.5;margin:8px 0}
.gap{display:inline-block;min-width:120px;border-bottom:3px solid var(--acc);color:var(--acc);padding:0 6px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.06)}}
/* match */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.col{display:flex;flex-direction:column;gap:9px}
.tile{background:#fff;border:2px solid var(--lav);border-radius:14px;padding:12px;font-size:18px;font-weight:700;color:var(--ink);text-align:center}
.tile.sel{border-color:var(--acc);background:var(--purple-bg)}
.tile.matched{background:var(--green-bg);border-color:var(--green);color:var(--green-d);cursor:default}
.made{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
/* keyboard */
.answer{width:100%;font-size:28px;font-weight:800;text-align:center;border:2.5px solid var(--lav);border-radius:14px;padding:12px;color:var(--ink);font-family:inherit;margin-top:10px}
.answer:focus{outline:none;border-color:var(--acc)}
.kb{display:flex;flex-direction:column;gap:6px;margin-top:12px;align-items:center}
.kb .row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.key{min-width:38px;height:44px;border-radius:10px;border:1.5px solid var(--lav);background:#fff;font-size:19px;font-weight:700;color:var(--ink)}
.key:active{background:var(--gold-bg)}
.key.wide{min-width:90px;font-size:15px}
.note{text-align:center;margin-top:10px;font-weight:700;min-height:24px}
/* keypad */
.code{display:flex;gap:10px;justify-content:center;margin:14px 0}
.code span{width:58px;height:70px;border-radius:14px;border:2.5px solid var(--gold);background:var(--gold-bg);display:grid;place-items:center;font-size:36px;font-weight:800;color:var(--gold-d)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center}
.pad button{height:58px;border-radius:14px;border:1.5px solid var(--lav);background:#fff;font-size:24px;font-weight:800;color:var(--ink)}
.pad button.go{background:var(--gold);color:#fff;border-color:var(--gold)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(74,68,88,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.show{display:flex}
.modal .card{max-width:560px;width:100%;max-height:86vh;overflow:auto}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--lav)}
.vrow:last-child{border-bottom:none}
.vrow .g{font-weight:800;font-size:17px;flex:1}
.spk{border:none;background:var(--lav2);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;color:var(--purple-d);flex:none}
.bigword{font-family:'Cormorant Garamond',serif;font-size:54px;font-weight:700;color:var(--gold-d);letter-spacing:3px;margin:6px 0}
.warn{background:var(--rose-bg);border:1px solid var(--rose);color:var(--rose-d);padding:10px 14px;border-radius:12px;font-size:14px;margin-top:10px;display:none}
footer{text-align:center;color:var(--muted);margin-top:26px;font-size:13px}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media(max-width:560px){h1{font-size:36px}.q{font-size:20px}.cols{gap:8px}.tile{font-size:15px;padding:10px 6px}.key{min-width:30px;height:40px;font-size:17px}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <header>
    <div class="brand">Glossomathia<small>PLAY · LISTEN · LEARN</small></div>
    <div class="tools">
      <button class="tbtn" id="vocabBtn">Λεξιλόγιο</button>
      <button class="tbtn" id="slowBtn">Αργή φωνή</button>
      <button class="tbtn on" id="soundBtn">Ήχοι: ναι</button>
    </div>
  </header>
  <div id="pack" class="pack" style="display:none"></div>
  <main id="stage"></main>
  <div id="voiceWarn" class="warn">Your device has no Greek voice installed, so words may be read with the wrong accent. On Windows: Settings › Time &amp; language › Speech › add Greek. On a phone, Chrome or Safari usually has one.</div>
  <footer>❀ Glossomathia · Γεια Χαρά 5 · Μάθημα 1 «Στο Γυμνάσιο» ❀</footer>
</div>

<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>

<script>
/* ================= DATA ================= */
const VOCAB = [
  ['η σχολική χρονιά','school year'],['καινούριος, καινούρια, καινούριο','new'],
  ['το Γυμνάσιο','middle school (grades 7 to 9)'],['το Δημοτικό','primary school'],
  ['η πρώτη Γυμνασίου','first year of middle school'],['ο συμμαθητής / η συμμαθήτρια','classmate'],
  ['ο φίλος','friend'],['παλιός','old, former'],['η τάξη','class, classroom'],
  ['συμπαθητικός','nice, likeable'],['ευγενικός','polite, kind'],['σίγουρος','sure'],
  ['η παρέα','company, group of friends'],['το διάλειμμα','break, recess'],['γελάω','I laugh'],
  ['ο δάσκαλος','teacher (primary school)'],['ο καθηγητής','teacher (secondary school)'],
  ['διδάσκω','I teach'],['το μάθημα','lesson, school subject'],['φιλικός','friendly'],
  ['αυστηρός','strict'],['αγαπημένος','favourite, dear'],['η Λογοτεχνία','literature'],
  ['ενδιαφέρον','interesting'],['το πρόγραμμα','schedule, timetable'],['γεμάτος','full'],
  ['το διάβασμα','studying, homework reading'],['μελετάω','I study'],['βοηθάω','I help'],
  ['καταλαβαίνω','I understand'],['προσπαθώ','I try'],['προσέχω','I pay attention'],
  ['περήφανος','proud'],['ο εγγονός','grandson'],['ο παππούς','grandfather'],['η γιαγιά','grandmother'],
  ['ο μπαμπάς','dad'],['άδειος','empty'],['κλαίω','I cry'],['μαθαίνω','I learn'],['αγενής','rude']
];
const EN = Object.fromEntries(VOCAB);

const R1 = [ // listening
  ['το διάλειμμα','break, recess'],['ο συμμαθητής','classmate'],['αυστηρός','strict'],
  ['το πρόγραμμα','schedule, timetable'],['η γιαγιά','grandmother'],['ο καθηγητής','secondary school teacher'],
  ['ευγενικός','polite, kind'],['το μάθημα','lesson, school subject'],['περήφανος','proud'],['η τάξη','class, classroom']
];
const R2 = [ // collocations
  ['η σχολική','χρονιά'],['ο καινούριος','συμμαθητής'],['η πρώτη','Γυμνασίου'],
  ['το γεμάτο','πρόγραμμα'],['η Νεοελληνική','Λογοτεχνία'],['η καλή','παρέα'],['ο παλιός','φίλος']
];
const R3 = [ // opposites
  ['φιλικός','αυστηρός',['σίγουρος','αγαπημένος']],
  ['καινούριος','παλιός',['γεμάτος','ευγενικός']],
  ['γεμάτος','άδειος',['ενδιαφέρον','περήφανος']],
  ['γελάω','κλαίω',['βοηθάω','προσέχω']],
  ['διδάσκω','μαθαίνω',['μελετάω','καταλαβαίνω']],
  ['ευγενικός','αγενής',['συμπαθητικός','φιλικός']],
  ['ο παππούς','ο εγγονός',['ο καθηγητής','ο φίλος']]
];
const R4 = [ // sentences
  ['Ξεκίνησε η καινούρια σχολική ___.','χρονιά',['τάξη','παρέα','ώρα']],
  ['Φέτος πηγαίνω στην ___ Γυμνασίου.','πρώτη',['καλή','παλιά','γεμάτη']],
  ['Ήδη στα ___ γελάμε πολύ!','διαλείμματα',['μαθήματα','προγράμματα','βιβλία']],
  ['Δεν έχουμε πια έναν δάσκαλο αλλά πολλούς ___.','καθηγητές',['συμμαθητές','φίλους','παππούδες']],
  ['Κάποιοι καθηγητές είναι φιλικοί και άλλοι λίγο πιο ___.','αυστηροί',['καινούριοι','γεμάτοι','σίγουροι']],
  ['Αυτή τη χρονιά το ___ μου είναι γεμάτο.','πρόγραμμα',['διάλειμμα','σχολείο','δωμάτιο']],
  ['Ο μπαμπάς με βοηθάει, όταν δεν ___ κάτι.','καταλαβαίνω',['γελάω','διδάσκω','προσέχω']],
  ['Πάντα ___ μέσα στην τάξη.','προσέχω',['κλαίω','κοιμάμαι','τρέχω']],
  ['Θέλω να είσαι ___ για τον εγγονό σου.','περήφανος',['αυστηρός','άδειος','αγενής']]
];
const R4EN = {'χρονιά':'year','πρώτη':'first','διαλείμματα':'breaks','καθηγητές':'teachers','αυστηροί':'strict','πρόγραμμα':'schedule','καταλαβαίνω':'I understand','προσέχω':'I pay attention','περήφανος':'proud'};
const R5 = ['σχολείο','τάξη','μάθημα','φίλος','διάλειμμα','καθηγητής'];
const R5EN = {'σχολείο':'school','τάξη':'class','μάθημα':'lesson','φίλος':'friend','διάλειμμα':'break','καθηγητής':'teacher'};

const ROOMS = [
  {n:1,cls:'c1',acc:'var(--green)',name:'Η Αυλή',en:'The schoolyard',task:'Άκου και βρες τι σημαίνει',digit:'ΠΕΝΤΕ'},
  {n:2,cls:'c2',acc:'var(--purple)',name:'Η Τάξη',en:'The classroom',task:'Ταίριαξε τις λέξεις',digit:'ΕΝΑ'},
  {n:3,cls:'c3',acc:'var(--rose)',name:'Το Γραφείο Καθηγητών',en:'The teachers’ office',task:'Βρες το αντίθετο',digit:'ΟΧΤΩ'},
  {n:4,cls:'c4',acc:'var(--blue)',name:'Η Βιβλιοθήκη',en:'The library',task:'Συμπλήρωσε το γράμμα του Νίκου',digit:'ΤΡΙΑ'},
  {n:5,cls:'c5',acc:'var(--gold)',name:'Η Πόρτα',en:'The school gate',task:'Υπαγόρευση και κωδικός',digit:''}
];
const CODE = '5183';

/* ================= STATE ================= */
const S = {unlocked:1, done:[false,false,false,false,false], mistakes:{}, sfx:true, slow:false, started:false};
const stage = document.getElementById('stage');
function miss(gr,en){ if(!S.mistakes[gr]) S.mistakes[gr]={en:en||EN[gr]||'',n:0}; S.mistakes[gr].n++; }
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const SPK = (s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const LOCK = `<svg width="16" height="16" viewBox="0 0 24 24" fill="#8a8398"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1h1zm2 0h6V7a3 3 0 0 0-6 0v3z"/></svg>`;
const CHECK = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3f7a54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>`;

/* ================= SOUND ================= */
let AC=null;
function ac(){ if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)(); } if(AC.state==='suspended') AC.resume(); return AC; }
function tone(f,dur,type='sine',vol=.14,delay=0){
  if(!S.sfx) return;
  try{ const c=ac(), o=c.createOscillator(), g=c.createGain(), t=c.currentTime+delay;
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
function noise(dur=.06,vol=.2,delay=0){
  if(!S.sfx) return;
  try{ const c=ac(), b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=c.createBufferSource(), g=c.createGain(); s.buffer=b; g.gain.value=vol; s.connect(g); g.connect(c.destination); s.start(c.currentTime+delay);
  }catch(e){}
}
const sfx = {
  tap(){ tone(880,.06,'sine',.06); },
  ok(){ tone(660,.16,'sine',.14); tone(990,.32,'sine',.12,.11); },
  no(){ tone(220,.22,'triangle',.16); tone(165,.3,'triangle',.14,.1); },
  unlock(){ noise(.05,.25); noise(.05,.25,.12); [523,659,784,1047].forEach((f,i)=>tone(f,.3,'sine',.12,.2+i*.1)); },
  bell(){ for(let i=0;i<18;i++){ tone(1400,.06,'square',.035,i*.075); tone(2100,.05,'sine',.03,i*.075+.02);} },
  win(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.35,'triangle',.12,i*.13)); }
};

/* ================= GREEK VOICE ================= */
let grVoice=null, voicesChecked=false;
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const v = speechSynthesis.getVoices();
  if(!v.length) return;
  grVoice = v.find(x=>/^el(-|_|$)/i.test(x.lang)) || null;
  voicesChecked = true;
  document.getElementById('voiceWarn').style.display = grVoice ? 'none' : 'block';
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function say(text){
  if(!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/___/g,'...'));
    u.lang='el-GR'; if(grVoice) u.voice=grVoice; u.rate = S.slow ? .6 : .9;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= TOOLS ================= */
document.getElementById('soundBtn').onclick = e => { S.sfx=!S.sfx; e.currentTarget.classList.toggle('on',S.sfx); e.currentTarget.textContent = 'Ήχοι: '+(S.sfx?'ναι':'όχι'); };
document.getElementById('slowBtn').onclick = e => { S.slow=!S.slow; e.currentTarget.classList.toggle('on',S.slow); };
document.getElementById('vocabBtn').onclick = () => {
  openModal(`<h2 style="color:var(--h1)">Λεξιλόγιο</h2><p class="en">Tap the speaker to hear each word.</p>`+
    VOCAB.slice(0,37).map(([g,e])=>`<div class="vrow"><button class="spk" data-say="${g}">${SPK(18)}</button><span class="g">${g}</span><span class="en">${e}</span></div>`).join('')+
    `<div class="center" style="margin-top:14px"><button class="btn" onclick="closeModal()">Κλείσιμο</button></div>`);
};
document.addEventListener('click', e => { const b=e.target.closest('[data-say]'); if(b){ say(b.dataset.say); } });
const modal = document.getElementById('modal');
function openModal(html){ document.getElementById('modalBody').innerHTML=html; modal.classList.add('show'); }
function closeModal(){ modal.classList.remove('show'); }
modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });

/* ================= SCREENS ================= */
function renderPack(){
  const p=document.getElementById('pack'); p.style.display = S.started ? 'flex':'none';
  p.innerHTML = `<b>Ο κωδικός της πόρτας:</b>` + ROOMS.slice(0,4).map((r,i)=>`<span class="slot ${S.done[i]?'got':''}">${S.done[i]?r.digit:'?'}</span>`).join('');
}
function intro(){
  stage.innerHTML = `<div class="card center">
    <h1>Το Κουδούνι Χτύπησε!</h1>
    <p class="subtitle">Escape room λεξιλογίου · Στο Γυμνάσιο</p>
    <p style="font-size:18px;line-height:1.6;max-width:600px;margin:0 auto">Ο Νίκος είναι στην πρώτη Γυμνασίου. Το κουδούνι χτύπησε και όλοι έφυγαν, αλλά εσύ έμεινες μέσα στο σχολείο! Η πόρτα έχει κλειδαριά με <b>τέσσερις αριθμούς</b>. Πέρασε από την αυλή, την τάξη, το γραφείο και τη βιβλιοθήκη και βρες τον κωδικό.</p>
    <p class="en" style="max-width:600px;margin:10px auto 0">The bell rang and you are locked inside the school. Each room hides one number of the gate code, written as a Greek word. Turn your sound on: you will listen a lot!</p>
    <div style="margin-top:20px"><button class="btn" id="startBtn">Ξεκίνα</button></div>
  </div>`;
  document.getElementById('startBtn').onclick = () => { ac(); sfx.bell(); S.started=true; loadVoices(); setTimeout(()=>say('Το κουδούνι χτύπησε!'),1500); map(); };
}
function map(){
  renderPack();
  stage.innerHTML = `<h2 style="color:var(--h1)">Ο χάρτης του σχολείου</h2><p class="en" style="margin-top:0">Rooms open one after the other.</p>
  <div class="map">${ROOMS.map((r,i)=>{
    const locked = r.n>S.unlocked, done=S.done[i];
    return `<button class="door ${r.cls}" data-room="${r.n}" ${locked?'disabled':''}>
      <span class="badge">${done?CHECK:locked?LOCK:''}</span>
      <div class="num">${r.n}</div><div class="name">${r.name}</div><div class="en">${r.en}</div>
      <div class="task">${done && r.digit ? 'Βρήκες: <b>'+r.digit+'</b>' : r.task}</div></button>`;}).join('')}</div>`;
  stage.querySelectorAll('.door').forEach(d=>d.onclick=()=>{ sfx.tap(); openRoom(+d.dataset.room); });
}
function head(n,i,total){
  const r=ROOMS[n-1]; document.body.style.setProperty('--acc',r.acc);
  return `<div class="roomhead"><button class="back" onclick="map()">‹ Χάρτης</button>
    <div class="dots">${Array.from({length:total},(_,k)=>`<span class="dot ${k<i?'done':''} ${k===i?'now':''}"></span>`).join('')}</div></div>
    <h2 style="color:${r.acc}">${r.n}. ${r.name}</h2><p class="en" style="margin-top:0">${r.en} · ${r.task}</p>`;
}
function openRoom(n){ ({1:room1,2:room2,3:room3,4:room4,5:room5})[n](); }
function finishRoom(n){
  S.done[n-1]=true; S.unlocked=Math.max(S.unlocked,n+1); sfx.unlock(); renderPack();
  const r=ROOMS[n-1];
  openModal(`<div class="center"><p style="font-weight:800;color:var(--sub);margin:0">Μπράβο! Βρήκες έναν αριθμό του κωδικού:</p>
    <div class="bigword">${r.digit}</div>
    <button class="mini" data-say="${r.digit.toLowerCase()}">${SPK(16)} Άκου</button>
    <p class="en">Keep this number word. You will need it at the gate.</p>
    <button class="btn gold" onclick="closeModal();map()">Στον χάρτη</button></div>`);
  setTimeout(()=>say(r.digit.toLowerCase()),900);
}

/* ---------- ROOM 1: listening ---------- */
function room1(){
  const items = shuffle(R1.slice()).slice(0,8); let i=0;
  function q(){
    if(i>=items.length) return finishRoom(1);
    const [gr,en]=items[i];
    const opts = shuffle([en, ...shuffle(R1.filter(x=>x[0]!==gr)).slice(0,3).map(x=>x[1])]);
    stage.innerHTML = head(1,i,items.length)+`<div class="card center">
      <p style="font-weight:700;margin:0">Άκου τη λέξη. Τι σημαίνει;</p>
      <button class="play" id="pl">${SPK(44)}</button>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>
      <div class="reveal" id="rv"></div></div>`;
    document.getElementById('pl').onclick=()=>say(gr);
    setTimeout(()=>say(gr),350);
    let wrong=false;
    stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(opts[+b.dataset.k]===en){
        b.classList.add('ok','pop'); sfx.ok(); document.getElementById('rv').textContent=gr;
        stage.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        setTimeout(()=>say(gr),250); setTimeout(()=>{i++;q();},1700);
      } else { b.classList.add('no','shake'); b.disabled=true; sfx.no(); if(!wrong){miss(gr,en);wrong=true;} setTimeout(()=>say(gr),400); }
    });
  }
  q();
}

/* ---------- ROOM 2: collocations ---------- */
function room2(){
  const L = shuffle(R2.map((p,k)=>({t:p[0],k}))), R = shuffle(R2.map((p,k)=>({t:p[1],k})));
  let sel=null, made=0; const wrongSet=new Set();
  stage.innerHTML = head(2,0,1)+`<div class="card">
    <p class="center" style="font-weight:700;margin:0">Ταίριαξε. Πάτησε μια λέξη αριστερά και μετά το ταίρι της δεξιά.</p>
    <p class="en center" style="margin:4px 0 0">Make phrases from Nikos's letter.</p>
    <div class="cols"><div class="col" id="cl">${L.map(x=>`<button class="tile" data-k="${x.k}">${x.t}</button>`).join('')}</div>
    <div class="col" id="cr">${R.map(x=>`<button class="tile" data-k="${x.k}">${x.t}</button>`).join('')}</div></div>
    <div class="made" id="made"></div></div>`;
  const cl=document.getElementById('cl'), cr=document.getElementById('cr');
  cl.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ if(b.classList.contains('matched'))return; cl.querySelectorAll('.tile').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel=b; sfx.tap(); say(b.textContent); });
  cr.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('matched'))return;
    if(!sel){ b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),400); return; }
    if(sel.dataset.k===b.dataset.k){
      const phrase = sel.textContent+' '+b.textContent;
      sel.classList.remove('sel'); sel.classList.add('matched'); b.classList.add('matched'); sel.disabled=b.disabled=true;
      sfx.ok(); say(phrase); made++;
      document.getElementById('made').insertAdjacentHTML('beforeend',`<button class="mini pop" data-say="${phrase}">${SPK(14)} ${phrase}</button>`);
      sel=null;
      if(made===R2.length) setTimeout(()=>finishRoom(2),1800);
    } else {
      sfx.no(); b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),400);
      const p=R2[+sel.dataset.k]; const key=p[0]+' '+p[1];
      if(!wrongSet.has(key)){ wrongSet.add(key); miss(key, ''); }
    }
  });
}

/* ---------- ROOM 3: opposites ---------- */
function room3(){
  const items = shuffle(R3.slice()); let i=0;
  function q(){
    if(i>=items.length) return finishRoom(3);
    const [w,ans,ds]=items[i]; const opts=shuffle([ans,...ds]);
    stage.innerHTML = head(3,i,items.length)+`<div class="card center">
      <p style="font-weight:700;margin:0">Ποιο είναι το αντίθετο;</p><p class="en" style="margin:2px 0 0">Find the opposite.</p>
      <div class="q" style="font-size:34px;color:var(--rose-d)">${w} <button class="spk" style="display:inline-grid;vertical-align:middle" data-say="${w}">${SPK(18)}</button></div>
      <p class="en" style="margin:0">${EN[w]||''}</p>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>
      <div class="reveal" id="rv"></div></div>`;
    setTimeout(()=>say(w),300);
    let wrong=false;
    stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(opts[+b.dataset.k]===ans){
        b.classList.add('ok','pop'); sfx.ok(); stage.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        document.getElementById('rv').innerHTML = `${w} ↔ ${ans}<div class="en">${EN[ans]||''}</div>`;
        setTimeout(()=>say(w+', '+ans),250); setTimeout(()=>{i++;q();},2100);
      } else { b.classList.add('no','shake'); b.disabled=true; sfx.no(); if(!wrong){miss(ans);wrong=true;} }
    });
  }
  q();
}

/* ---------- ROOM 4: letter sentences ---------- */
function room4(){
  let i=0;
  function q(){
    if(i>=R4.length) return finishRoom(4);
    const [s,ans,ds]=R4[i]; const opts=shuffle([ans,...ds]);
    stage.innerHTML = head(4,i,R4.length)+`<div class="card">
      <p class="center" style="font-weight:700;margin:0">Το γράμμα του Νίκου στον παππού του. Συμπλήρωσε τη λέξη που λείπει.</p>
      <div class="q" id="sent">${s.replace('___','<span class="gap">&nbsp;</span>')}</div>
      <div class="center"><button class="mini" id="hear">${SPK(14)} Άκου την πρόταση</button></div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>
      <div class="reveal" id="rv" style="font-size:15px"></div></div>`;
    document.getElementById('hear').onclick=()=>say(s);
    let wrong=false;
    stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(opts[+b.dataset.k]===ans){
        b.classList.add('ok','pop'); sfx.ok(); stage.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        const full=s.replace('___',ans);
        document.getElementById('sent').innerHTML = s.replace('___',`<span class="gap pop">${ans}</span>`);
        document.getElementById('rv').innerHTML = `<span class="en">${ans} = ${R4EN[ans]}</span>`;
        setTimeout(()=>say(full),300); setTimeout(()=>{i++;q();}, 1500+full.length*75*(S.slow?1.4:1));
      } else { b.classList.add('no','shake'); b.disabled=true; sfx.no(); if(!wrong){miss(ans,R4EN[ans]);wrong=true;} }
    });
  }
  q();
}

/* ---------- ROOM 5: dictation + code ---------- */
const TONOS = {'α':'ά','ε':'έ','η':'ή','ι':'ί','ο':'ό','υ':'ύ','ω':'ώ'};
const plain = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/ς/g,'σ').trim();
function room5(){
  let i=0;
  function q(){
    if(i>=R5.length) return keypad();
    const w=R5[i];
    stage.innerHTML = head(5,i,R5.length+1)+`<div class="card center">
      <p style="font-weight:700;margin:0">Υπαγόρευση: άκου και γράψε τη λέξη.</p><p class="en" style="margin:2px 0 0">Dictation. Listen and type the word (no article). Use the Greek keys below.</p>
      <button class="play" id="pl">${SPK(44)}</button>
      <input class="answer" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" lang="el">
      <div class="kb" id="kb"></div>
      <div style="margin-top:12px"><button class="btn gold" id="chk">Έλεγχος</button></div>
      <div class="note" id="nt"></div></div>`;
    const inp=document.getElementById('ans');
    document.getElementById('pl').onclick=()=>say(w);
    setTimeout(()=>say(w),350);
    buildKB(inp);
    let tries=0;
    const check=()=>{
      const v=inp.value.trim().toLowerCase(), nt=document.getElementById('nt');
      if(!v) return;
      if(v===w){ sfx.ok(); nt.style.color='var(--green-d)'; nt.textContent='Σωστά! '+w+' = '+R5EN[w]; inp.classList.add('pop'); say(w); setTimeout(()=>{i++;q();},1600); }
      else if(plain(v)===plain(w)){ sfx.ok(); nt.style.color='var(--gold-d)'; nt.innerHTML='Σχεδόν τέλεια! Πρόσεξε τον τόνο: <b>'+w+'</b>'; inp.value=w; say(w); setTimeout(()=>{i++;q();},2300); }
      else { sfx.no(); tries++; inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),400);
        if(tries===1) miss(w,R5EN[w]);
        nt.style.color='var(--rose-d)';
        nt.innerHTML = tries<2 ? 'Όχι ακόμα. Άκου ξανά!' : 'Βοήθεια: η λέξη αρχίζει με <b>'+w.slice(0,Math.min(tries,w.length-1))+'…</b>';
        setTimeout(()=>say(w),500); }
    };
    document.getElementById('chk').onclick=check;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
  }
  q();
}
function buildKB(inp){
  const rows=['ερτυθιοπ','ασδφγηξκλ','ζχψωβνμς'];
  const kb=document.getElementById('kb');
  kb.innerHTML = rows.map(r=>`<div class="row">${[...r].map(c=>`<button class="key" data-c="${c}">${c}</button>`).join('')}</div>`).join('')+
    `<div class="row"><button class="key wide" data-c="tonos">τόνος ΄</button><button class="key wide" data-c="sp">κενό</button><button class="key wide" data-c="bs">⌫ σβήσε</button></div>`;
  kb.querySelectorAll('.key').forEach(k=>k.onclick=()=>{
    const c=k.dataset.c; sfx.tap();
    if(c==='bs') inp.value=inp.value.slice(0,-1);
    else if(c==='sp') inp.value+=' ';
    else if(c==='tonos'){ // add accent to the last vowel
      const a=[...inp.value];
      for(let j=a.length-1;j>=0;j--){ if(TONOS[a[j]]){ a[j]=TONOS[a[j]]; break; } }
      inp.value=a.join('');
    } else inp.value+=c;
  });
}
function keypad(){
  let entered='';
  stage.innerHTML = head(5,R5.length,R5.length+1)+`<div class="card center">
    <p style="font-weight:800;margin:0;font-size:19px">Η κλειδαριά της πόρτας</p>
    <p class="en" style="margin:2px 0 0">Turn your four number words into digits, in order: room 1, 2, 3, 4.</p>
    <div style="margin-top:8px">${ROOMS.slice(0,4).map(r=>`<button class="mini" data-say="${r.digit.toLowerCase()}" style="margin:3px">${SPK(14)} ${r.digit}</button>`).join('')}</div>
    <div class="code" id="code">${'<span></span>'.repeat(4)}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${d}</button>`).join('')}<button data-d="c" style="font-size:15px">σβήσε</button><button data-d="0">0</button><button data-d="ok" class="go" style="font-size:16px">Άνοιξε</button></div>
    <div class="note" id="nt"></div></div>`;
  const show=()=>document.querySelectorAll('#code span').forEach((s,k)=>s.textContent=entered[k]||'');
  stage.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{
    const d=b.dataset.d;
    if(d==='c'){ entered=entered.slice(0,-1); sfx.tap(); }
    else if(d==='ok'){
      if(entered===CODE) return win();
      sfx.no(); document.getElementById('code').classList.add('shake'); setTimeout(()=>document.getElementById('code').classList.remove('shake'),400);
      document.getElementById('nt').style.color='var(--rose-d)'; document.getElementById('nt').textContent='Λάθος κωδικός. Άκου ξανά τους αριθμούς!';
      entered='';
    } else if(entered.length<4){ entered+=d; tone(500+(+d)*60,.08,'sine',.08); }
    show();
  });
}
function win(){
  S.done[4]=true; sfx.unlock(); setTimeout(sfx.bell,500); setTimeout(sfx.win,1900); confetti();
  setTimeout(()=>say('Μπράβο! Βγήκες από το σχολείο!'),2900);
  const m = Object.entries(S.mistakes);
  stage.innerHTML = `<div class="card center">
    <h1>Μπράβο! Βγήκες!</h1>
    <p class="subtitle">Η πόρτα άνοιξε: ${CODE.split('').join(' · ')}</p>
    <p style="font-size:17px">Ο Νίκος σε περιμένει στην αυλή με το γράμμα για τον παππού του.</p>
    ${m.length ? `<h2 style="color:var(--rose-d);margin-top:18px">Λέξεις για επανάληψη</h2><p class="en" style="margin-top:0">Words to practise again. Tap to listen.</p>
      <div style="text-align:left;max-width:460px;margin:0 auto">${m.map(([g,o])=>`<div class="vrow"><button class="spk" data-say="${g}">${SPK(18)}</button><span class="g">${g}</span><span class="en">${o.en}</span></div>`).join('')}</div>`
      : `<h2 style="color:var(--green-d);margin-top:18px">Τέλεια! Χωρίς κανένα λάθος!</h2>`}
    <div style="margin-top:20px"><button class="btn" onclick="location.reload()">Παίξε ξανά</button></div></div>`;
  document.getElementById('pack').style.display='none';
}

/* ================= CONFETTI ================= */
function confetti(){
  const c=document.getElementById('confetti'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#8e7cc3','#7aa6b9','#6fae84','#c98bb0','#c6a75e'];
  const P=Array.from({length:170},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,r:5+Math.random()*6,v:2+Math.random()*3,s:Math.random()*6,c:cols[Math.floor(Math.random()*5)],a:Math.random()*6}));
  let t=0; (function f(){ x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{ p.y+=p.v; p.a+=.1; p.x+=Math.sin(p.a)*1.4; x.fillStyle=p.c; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if(++t<330) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}

intro();
</script>
