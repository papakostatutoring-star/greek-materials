<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Η Πόρτα που Μιλάει</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --plum:#4a4458; --muted:#7a7290; --wordmark:#b3a7c9;
  --purple:#8e7cc3; --purple-d:#6d5b87; --purple-bg:#f7eef9;
  --blue:#7aa6b9; --blue-d:#3f6d82; --blue-bg:#e9f1f7;
  --green:#6fae84; --green-d:#3f7a54; --green-bg:#eaf6ee;
  --rose:#c98bb0; --rose-d:#9c5980; --rose-bg:#fbeef5;
  --wine:#8e4a73; --gold:#c6a75e; --gold-bg:#fbf5e6;
  --lav2:#f7f2fc; --paper:#fffdfb; --line:#e6ddf0;
  --ok:#3f7a54; --ok-bg:#e3f4e8; --bad:#a8505f; --bad-bg:#fbe7ea;
  --accent:var(--purple); --accent-d:var(--purple-d); --accent-bg:var(--purple-bg);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,var(--lav2),#fdfbff 40%,var(--lav2));color:var(--plum);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.5;min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 40px}
header.top{text-align:center;margin-bottom:14px}
.brand{font-family:"Cormorant Garamond",serif;color:var(--wordmark);letter-spacing:.18em;font-size:14px;text-transform:uppercase}
h1{font-family:"Cormorant Garamond",serif;font-weight:700;color:var(--purple);font-size:clamp(34px,7vw,48px);margin:2px 0 0;line-height:1.1;text-wrap:balance}
.subtitle{color:#a88bcf;font-style:italic;font-family:"Cormorant Garamond",serif;font-size:20px}
h2{font-family:"Cormorant Garamond",serif;color:var(--accent-d);font-size:30px;margin:0 0 4px;line-height:1.15;text-wrap:balance}
h3{font-family:"Cormorant Garamond",serif;color:var(--accent);font-size:22px;margin:16px 0 6px}
.en{color:var(--muted);font-size:14.5px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px 20px;box-shadow:0 6px 24px rgba(110,90,150,.08);animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.locks{display:flex;justify-content:center;gap:10px;margin:10px 0 16px;flex-wrap:wrap}
.lock{display:flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--muted)}
.lock.on{border-color:currentColor}
.lock.done{color:#fff}
.lock .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.r0{color:var(--purple)} .r1{color:var(--blue)} .r2{color:var(--green)} .r3{color:var(--rose)}
.lock.done.r0{background:var(--purple)} .lock.done.r1{background:var(--blue)} .lock.done.r2{background:var(--green)} .lock.done.r3{background:var(--rose)}
.lock.done .dot{background:#fff}
.progress{display:flex;gap:5px;margin:2px 0 14px}
.progress span{flex:1;height:6px;border-radius:6px;background:var(--line)}
.progress span.d{background:var(--accent)}
.progress span.c{background:var(--accent-d)}
.q{font-size:21px;font-weight:700;margin:4px 0 6px}
.qsub{color:var(--muted);font-size:15px;margin-bottom:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt,.chip{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:18px;font-weight:700;color:var(--plum);transition:transform .1s,border-color .15s,background .15s}
.opt:hover:not(:disabled),.chip:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.opt.good,.chip.good{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);opacity:.75}
.chip.sel{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 3px var(--accent-bg)}
.chip.gone{visibility:hidden}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.btn{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:12px 24px;font-size:17px;font-weight:800;box-shadow:0 4px 12px rgba(110,90,150,.18)}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:#fff;color:var(--accent-d);border:2px solid var(--accent);box-shadow:none}
.btn.small{padding:7px 14px;font-size:14.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.right{justify-content:flex-end}
.between{justify-content:space-between}
.fb{margin-top:14px;border-radius:14px;padding:11px 14px;font-weight:600;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.hintbox{margin-top:12px;background:var(--gold-bg);border-left:4px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:15.5px;display:none}
.hintbox.show{display:block}
.foot-actions{margin-top:18px}
.speak{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:none;background:var(--accent-bg);color:var(--accent-d);flex:none}
.speak:hover{background:var(--accent);color:#fff}
.speak.big{width:84px;height:84px}
.speak svg{width:55%;height:55%}
.listen-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 10px}
.reveal{font-size:22px;font-weight:800;color:var(--accent-d);min-height:30px}
/* lesson table */
.vt{width:100%;border-collapse:separate;border-spacing:0 6px;margin:10px 0;font-size:16px}
.vt th{font-family:"Cormorant Garamond",serif;font-size:18px;color:var(--accent-d);text-align:left;padding:0 8px}
.vt th .en{font-family:Nunito,sans-serif;font-size:12px;display:block;font-weight:600}
.vt td{background:var(--accent-bg);padding:7px 8px}
.vt td:first-child{border-radius:12px 0 0 12px;color:var(--muted)}
.vt td:last-child{border-radius:0 12px 12px 0}
.vt td.f{font-weight:800}
.vt .cell{display:flex;align-items:center;gap:6px;justify-content:space-between}
.vt .speak{width:28px;height:28px}
.tablewrap{overflow-x:auto}
.tip{background:var(--lav2);border:1px dashed var(--wordmark);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15.5px}
.tip b{color:var(--accent-d)}
.hl{color:var(--wine);font-weight:800}
/* order, match, sort, build */
.slots{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:14px;background:var(--accent-bg);margin:8px 0 12px}
.slot{background:#fff;border:2px solid var(--accent);color:var(--accent-d);border-radius:12px;padding:8px 12px;font-weight:800;animation:pop .25s}
.slot.empty{border-style:dashed;border-color:var(--wordmark);color:var(--wordmark)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.bucket{border:2px dashed var(--accent);border-radius:16px;padding:10px;min-height:96px;background:#fff;text-align:center;cursor:pointer}
.bucket .bt{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:700;color:var(--accent-d)}
.bucket .be{font-size:12.5px;color:var(--muted)}
.bucket .in{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:6px}
.bucket .in span{background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:2px 9px;font-size:14px;font-weight:700}
.bucket.ready{background:var(--accent-bg)}
.build{display:flex;flex-direction:column;gap:12px}
.build .lbl{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.forge{display:flex;align-items:center;justify-content:center;gap:4px;min-height:64px;border-radius:16px;background:var(--accent-bg);font-size:30px;font-weight:800;color:var(--accent-d);font-family:"Cormorant Garamond",serif}
.forge .ph{color:var(--wordmark)}
/* found & keypad */
.scroll{text-align:center;padding:10px 0}
.scroll .word{font-family:"Cormorant Garamond",serif;font-size:56px;color:var(--accent-d);font-weight:700;line-height:1.1}
.found{display:flex;justify-content:center;gap:10px;margin:14px 0;flex-wrap:wrap}
.found div{width:72px;height:76px;border-radius:14px;border:2px dashed var(--wordmark);display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-size:19px;font-weight:700;text-align:center;line-height:1.05;padding:4px}
.found div.f{border-style:solid;background:#fff}
.screen{display:flex;justify-content:center;gap:10px;margin:14px 0}
.screen span{width:52px;height:62px;border-radius:12px;border:2px solid var(--gold);background:var(--gold-bg);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin:10px 0}
.keypad button{height:60px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:24px;font-weight:800;color:var(--plum)}
.keypad button:hover{border-color:var(--wine)}
.keypad .k-del{font-size:16px}
.door{text-align:center;font-size:15px;color:var(--muted)}
.review ul{margin:6px 0;padding-left:20px}
.review li{margin:5px 0}
.review .ca{color:var(--ok);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--lav2);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:26px;color:var(--purple-d)}
footer{text-align:center;color:var(--wordmark);margin-top:26px;font-family:"Cormorant Garamond",serif;font-size:17px;letter-spacing:.06em}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:520px){
  .q{font-size:19px}
  .opt{font-size:16.5px;padding:11px}
  .scroll .word{font-size:44px}
  .found div{width:64px;height:68px;font-size:17px}
  .forge{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <header class="top">
    <div class="brand">Glossomathia · Ελληνικά A2</div>
    <h1>Η Πόρτα που Μιλάει</h1>
    <div class="subtitle">Η προστακτική · ομαλά και ανώμαλα ρήματα</div>
  </header>
  <div class="locks" id="locks"></div>
  <main id="app"></main>
  <footer>❀ Glossomathia · Play · Listen · Learn 🌿</footer>
</div>

<script>
/* ========== DATA ========== */
/* [present, English, singular stem, singular ending, plural stem, plural ending] */
const REG_A=[
 ["διαβάζω","read","διάβα","σε","διαβά","στε"],
 ["γράφω","write","γρά","ψε","γρά","ψτε"],
 ["ανοίγω","open","άνοι","ξε","ανοί","ξτε"],
 ["κλείνω","close","κλεί","σε","κλεί","στε"],
 ["αγοράζω","buy","αγόρα","σε","αγορά","στε"],
 ["πληρώνω","pay","πλήρω","σε","πληρώ","στε"],
 ["δουλεύω","work","δούλε","ψε","δουλέ","ψτε"],
 ["χορεύω","dance","χόρε","ψε","χορέ","ψτε"],
 ["τρέχω","run","τρέ","ξε","τρέ","ξτε"],
 ["παίζω","play","παί","ξε","παί","ξτε"],
 ["ετοιμάζω","prepare","ετοίμα","σε","ετοιμά","στε"],
 ["μαγειρεύω","cook","μαγείρε","ψε","μαγειρέ","ψτε"]
];
const REG_B=[
 ["μιλάω","speak","μίλη","σε","μιλή","στε"],
 ["ρωτάω","ask","ρώτη","σε","ρωτή","στε"],
 ["αγαπάω","love","αγάπη","σε","αγαπή","στε"],
 ["περπατάω","walk","περπάτη","σε","περπατή","στε"],
 ["τηλεφωνώ","phone","τηλεφώνη","σε","τηλεφωνή","στε"],
 ["οδηγώ","drive","οδήγη","σε","οδηγή","στε"],
 ["ζητάω","ask for","ζήτη","σε","ζητή","στε"],
 ["βοηθάω","help","βοήθη","σε","βοηθή","στε"],
 ["κρατάω","hold, keep","κράτη","σε","κρατή","στε"],
 ["ξεχνάω","forget","ξέχα","σε","ξεχά","στε"],
 ["γελάω","laugh","γέλα","σε","γελά","στε"]
];
const IRR=[
 ["έρχομαι","come","έλα","ελάτε"],["τρώω","eat","φάε","φάτε"],["πίνω","drink","πιες","πιείτε"],
 ["βλέπω","see, look","δες","δείτε"],["λέω","say, tell","πες","πείτε"],["βρίσκω","find","βρες","βρείτε"],
 ["μπαίνω","go in","μπες","μπείτε"],["βγαίνω","go out","βγες","βγείτε"],["ανεβαίνω","go up","ανέβα","ανεβείτε"],
 ["κατεβαίνω","go down","κατέβα","κατεβείτε"],["κάνω","do, make","κάνε","κάντε"],["φέρνω","bring","φέρε","φέρτε"],
 ["δίνω","give","δώσε","δώστε"],["παίρνω","take","πάρε","πάρτε"],["ακούω","listen","άκου","ακούστε"],
 ["κάθομαι","sit","κάτσε","καθίστε"],["σηκώνομαι","get up","σήκω","σηκωθείτε"],["πηγαίνω","go","πήγαινε","πηγαίνετε"],
 ["περιμένω","wait","περίμενε","περιμένετε"],["στέλνω","send","στείλε","στείλτε"]
];
/* [present, English, imperative εσύ, negative εσύ, negative εσείς] */
const NEG=[
 ["γράφω","write","γράψε","μη γράψεις","μη γράψετε"],["ανοίγω","open","άνοιξε","μην ανοίξεις","μην ανοίξετε"],
 ["τρώω","eat","φάε","μη φας","μη φάτε"],["πίνω","drink","πιες","μην πιεις","μην πιείτε"],
 ["λέω","say","πες","μην πεις","μην πείτε"],["κλείνω","close","κλείσε","μην κλείσεις","μην κλείσετε"],
 ["ξεχνάω","forget","ξέχασε","μην ξεχάσεις","μην ξεχάσετε"],["μιλάω","speak","μίλησε","μη μιλήσεις","μη μιλήσετε"],
 ["αγγίζω","touch","άγγιξε","μην αγγίξεις","μην αγγίξετε"],["φεύγω","leave","φύγε","μη φύγεις","μη φύγετε"],
 ["τρέχω","run","τρέξε","μην τρέξεις","μην τρέξετε"],["αργώ","be late","άργησε","μην αργήσεις","μην αργήσετε"]
];
const sgOf=v=>v[2]+v[3], plOf=v=>v[4]+v[5];
const findV=(list,inf)=>list.find(v=>v[0]===inf);

const ROOMS=[
  {name:"Το Δωμάτιο του -ω", short:"-ω", en:"Regular verbs ending in -ω", digit:"τέσσερα"},
  {name:"Ο Διάδρομος του -άω", short:"-άω / -ώ", en:"Regular verbs ending in -άω / -ώ", digit:"ένα"},
  {name:"Η Αποθήκη των Ανώμαλων", short:"Ανώμαλα", en:"Irregular verbs", digit:"επτά"},
  {name:"Η Πόρτα του «Μη»", short:"Μη / Μην", en:"Saying don't", digit:"δύο"}
];
const CODE="4172";
const ACC=[["--purple","--purple-d","--purple-bg"],["--blue","--blue-d","--blue-bg"],["--green","--green-d","--green-bg"],["--rose","--rose-d","--rose-bg"]];
const PERSONS=[["εσύ","one person you know"],["εσείς","many people, or polite"]];

/* ========== HELPERS ========== */
const $=s=>document.querySelector(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,k)=>shuffle(a).slice(0,k);
const uniq=a=>[...new Set(a)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const SPK='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M18.5 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
/* capitalise options when the blank opens a sentence */
const blankStarts=q=>/(^|[.!;:«]\s*)___/.test(q.trim());

/* ========== SPEECH ========== */
let elVoice=null;
function loadVoices(){try{const v=speechSynthesis.getVoices();elVoice=v.find(x=>x.lang&&x.lang.toLowerCase().startsWith("el"))||null}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function say(t){
  if(!("speechSynthesis" in window)) return false;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="el-GR";if(elVoice)u.voice=elVoice;u.rate=.85;speechSynthesis.speak(u);return true}catch(e){return false}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b)say(b.dataset.say)});
const spk=(t,cls="")=>`<button class="speak ${cls}" data-say="${esc(t)}" aria-label="Άκου">${SPK}</button>`;

/* ========== PUZZLE BUILDERS ========== */
function buildPuzzle(list,v,plural,review){
  const target=plural?plOf(v):sgOf(v);
  const fake=v[0].slice(0,-1);                       /* e.g. διαβάζ, μιλά */
  const stems=shuffle(uniq([v[2],v[4],fake]));
  const ends=shuffle(uniq([v[3],v[5],v[3]==="σε"?"ψε":"σε"]));
  return {type:"build",q:`${v[0]} → ${plural?"εσείς":"εσύ"}`,sub:`${cap(v[1])}! Tap a beginning, then an ending. (${plural?"to many people, or polite":"to one person"})`,stems,ends,target,
    hint:plural?"Για το «εσείς» ο τόνος είναι στην προτελευταία συλλαβή: -στε, -ξτε, -ψτε.":"Για το «εσύ» ο τόνος πάει όσο πιο πίσω γίνεται: διάβασε, άνοιξε, μίλησε.",
    review:review||`${v[0]} → ${plural?"εσείς":"εσύ"}`};
}
function ctxPuzzle(q,sub,answer,others,hint,review){
  const start=blankStarts(q);
  const fix=s=>start?cap(s):s;
  return {type:"mcq",q,sub,options:shuffle(uniq([answer,...others]).map(fix)),answer:fix(answer),hint,review:review||q};
}
function sortPersons(list,n,review){
  const items=[];
  sample(list,n).forEach((v,i)=>{const pl=i%2===1;items.push([pl?(v.length===4?v[3]:plOf(v)):(v.length===4?v[2]:sgOf(v)),pl?1:0])});
  return {type:"sort",q:"Σε ποιον μιλάς; Βάλε κάθε τύπο στη σωστή θέση.",sub:"Tap a form, then tap εσύ or εσείς.",buckets:PERSONS,items:shuffle(items),
    hint:"Το «εσείς» τελειώνει συνήθως σε -τε: διαβάστε, ελάτε, φάτε.",review:review||"εσύ ή εσείς"};
}
function listenPuzzle(list,v,plural,isIrr){
  const form=isIrr?(plural?v[3]:v[2]):(plural?plOf(v):sgOf(v));
  const pair=isIrr?(plural?v[2]:v[3]):(plural?sgOf(v):plOf(v));
  const others=sample(list.filter(x=>x!==v),2).map(x=>isIrr?(plural?x[3]:x[2]):(plural?plOf(x):sgOf(x)));
  return {type:"listen",q:"Άκου την εντολή. Ποια είναι;",sub:"Listen and tap the command you hear.",speak:form,options:shuffle(uniq([form,pair,...others])),answer:form,
    hint:"Το «εσείς» έχει μία συλλαβή παραπάνω στο τέλος: -τε.",review:`Άκουσες «${form}»`};
}

/* ========== ROOMS ========== */
function room0(){
  const P=[];
  P.push({type:"match",q:"Ταίριαξε το ρήμα με την προστακτική (εσύ).",sub:"Match each verb with its command to one person.",pairs:sample(REG_A,5).map(v=>[v[0],sgOf(v)]),hint:"Το -ζω γίνεται -σε, το -γω γίνεται -ξε, το -φω και το -εύω γίνονται -ψε.",review:"Ρήμα σε -ω → προστακτική"});
  sample(REG_A,3).forEach((v,i)=>P.push(buildPuzzle(REG_A,v,i===1)));
  P.push(sortPersons(REG_A,8));
  const C=[
    ["διαβάζω","Η δασκάλα λέει στην τάξη: «___ το κείμενο!»",1,"The teacher speaks to the whole class."],
    ["γράφω","Μαμά, ___ μου τη συνταγή, σε παρακαλώ!",0,"You speak to your mom."],

function rOrder(p,body){
  let k=0;
  body.innerHTML=`<div class="slots" id="slots">${p.items.map(()=>`<span class="slot empty">?</span>`).join("")}</div><div class="pool">${shuffle(p.items).map(x=>`<button class="chip">${esc(x)}</button>`).join("")}</div>`;
  body.querySelectorAll(".pool .chip").forEach(b=>b.onclick=()=>{
    if(b.textContent===p.items[k]){const s=$("#slots").children[k];s.className="slot";s.textContent=b.textContent;b.classList.add("gone");k++;$("#fb").className="fb";if(k===p.items.length){say(p.items.join(" "));solved()}}
    else{shake(b);logMiss(p,p.items.join(" "));wrong(`Όχι ακόμα. Ποια λέξη έρχεται μετά; <span class="en">Not yet. Which word comes next?</span>`)}
  });
}
function rMatch(p,body){
  let selL=null,left=0;
  body.innerHTML=`<div class="match"><div class="col">${shuffle(p.pairs).map(x=>`<button class="chip L" data-k="${esc(x[0])}">${esc(x[0])}</button>`).join("")}</div><div class="col">${shuffle(p.pairs).map(x=>`<button class="chip R" data-k="${esc(x[0])}">${esc(x[1])}</button>`).join("")}</div></div>`;
  body.querySelectorAll(".L").forEach(b=>b.onclick=()=>{body.querySelectorAll(".L").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");selL=b});
  body.querySelectorAll(".R").forEach(b=>b.onclick=()=>{
    if(!selL){wrong("Πρώτα διάλεξε από αριστερά. <span class='en'>Choose from the left first.</span>");return}
    if(b.dataset.k===selL.dataset.k){[b,selL].forEach(x=>{x.classList.remove("sel");x.classList.add("good");x.disabled=true});say(bare(b.textContent));selL=null;left++;$("#fb").className="fb";if(left===p.pairs.length)solved()}
    else{shake(b);const pr=p.pairs.find(x=>x[0]===selL.dataset.k);logOnce(p,pr[0],`${pr[0]} → ${pr[1]}`);wrong()}
  });
}
function rSort(p,body){
  let sel=null,left=p.items.length;
  body.innerHTML=`<div class="pool">${p.items.map((x,i)=>`<button class="chip" data-i="${i}">${esc(x[0])}</button>`).join("")}</div><div class="buckets">${p.buckets.map((b,i)=>`<div class="bucket" role="button" tabindex="0" data-b="${i}"><div class="bt">${b[0]}</div><div class="be">${b[1]}</div><div class="in"></div></div>`).join("")}</div>`;
  body.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{body.querySelectorAll(".chip").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=b;body.querySelectorAll(".bucket").forEach(x=>x.classList.add("ready"))});
  body.querySelectorAll(".bucket").forEach(bk=>{const act=()=>{
    if(!sel)return;const it=p.items[+sel.dataset.i];
    if(+bk.dataset.b===it[1]){bk.querySelector(".in").insertAdjacentHTML("beforeend",`<span>${esc(it[0])}</span>`);say(it[0]);sel.classList.add("gone");sel=null;left--;body.querySelectorAll(".bucket").forEach(x=>x.classList.remove("ready"));$("#fb").className="fb";if(left===0)solved()}
    else{shake(bk);logOnce(p,it[0],`${it[0]}: ${p.buckets[it[1]][0]}`);wrong()}
  };bk.onclick=act;bk.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act()}}});
}

/* ========== FINAL DOOR (keypad, no typing) ========== */
function renderFinal(app){
  setAccent(3);document.documentElement.style.setProperty("--accent","var(--wine)");
  S.code="";
  app.innerHTML=`<div class="card"><h2 style="color:var(--wine);text-align:center">Η τελευταία πόρτα</h2>
  <p class="door">Τα κομμάτια του κωδικού είναι λέξεις. Πάτα τους <b>αριθμούς</b> με τη σειρά.<br><span class="en">Your code pieces are words. Tap them as numbers, in order.</span></p>
  ${foundHTML()}
  <div class="screen" id="screen"></div>
  <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}<button class="k-del" data-n="del">σβήσε</button><button data-n="0">0</button><span></span></div>
  <div class="fb" id="fb"></div><div id="bonus"></div></div>`;
  const draw=()=>{$("#screen").innerHTML=[0,1,2,3].map(i=>`<span>${S.code[i]||""}</span>`).join("")};draw();
  document.querySelectorAll(".keypad button").forEach(b=>b.onclick=()=>{
    if(S.code==="LOCKED")return;
    const n=b.dataset.n;
    if(n==="del"){S.code=S.code.slice(0,-1);draw();return}
    if(S.code.length<4){S.code+=n;draw()}
    if(S.code.length===4){
      if(S.code===CODE){const fb=$("#fb");fb.className="fb show ok";fb.innerHTML="Ο κωδικός είναι σωστός! Η πόρτα σε ακούει...";S.code="LOCKED";bonus()}
      else{const fb=$("#fb");fb.className="fb show no";fb.innerHTML=`Λάθος κωδικός. Κοίτα πάλι τις λέξεις: ${ROOMS.map(r=>r.digit).join(", ")}.`;shake($("#screen"));setTimeout(()=>{S.code="";draw()},500)}
    }
  });
}
function bonus(){
  const p={q:"Η πόρτα λέει: «Πες μου τη μαγική λέξη!» Τι της λες;",sub:"There is only one door, and you know her well. Tell her to open!",options:shuffle(["Άνοιξε!","Ανοίξτε!","Μην ανοίξεις!","Ανοίγω!"]),answer:"Άνοιξε!",review:"Η μαγική λέξη για μία πόρτα"};
  $("#bonus").innerHTML=`<div style="margin-top:18px"><div class="q">${p.q}</div><div class="qsub">${p.sub}</div><div id="bm"></div></div>`;
  const body=$("#bm");
  body.innerHTML=`<div class="opts">${p.options.map(o=>`<button class="opt">${o}</button>`).join("")}</div>`;
  body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(b.textContent===p.answer){b.classList.add("good");body.querySelectorAll(".opt").forEach(x=>x.disabled=true);say("Άνοιξε");setTimeout(()=>{S.screen="win";render()},1100)}
    else{b.classList.add("bad");shake(b);b.disabled=true;if(!p._logged){p._logged=true;S.miss[3].push({q:p.review,a:p.answer})}}
  });
}

/* ========== WIN ========== */
function renderWin(app){
  setAccent(0);
  const total=S.miss.reduce((a,m)=>a+m.length,0);
  const review=S.miss.map((m,i)=>m.length?`<h3 style="color:var(${ACC[i][1]})">${ROOMS[i].name}</h3><ul>${m.map(x=>`<li>${esc(x.q)}: <span class="ca">${esc(x.a)}</span></li>`).join("")}</ul>`:"").join("");
  app.innerHTML=`<div class="card"><div style="text-align:center"><div class="en">Η πόρτα άνοιξε! The door is open!</div><h2 style="font-size:38px">Συγχαρητήρια!</h2>
  <p>Τώρα ξέρεις να δίνεις εντολές στα ελληνικά. ${spk("Συγχαρητήρια! Τώρα ξέρεις να δίνεις εντολές στα ελληνικά.")}<br><span class="en">Now you can give commands in Greek.</span></p></div>
  <div class="stats"><div><b>4/4</b>δωμάτια</div><div><b>${total}</b>για επανάληψη</div><div><b>${S.hints}</b>βοήθειες</div></div>
  <div class="review">${total?`<h2 style="font-size:24px;color:var(--purple-d)">Η λίστα επανάληψής σου</h2><div class="en">Your personal review list: the items that tripped you up, with the right answer.</div>${review}`:`<div class="tip" style="text-align:center"><b>Τέλεια!</b> Κανένα λάθος. <span class="en">Not a single mistake!</span></div>`}</div>
  <div class="row" style="justify-content:center;margin-top:18px"><button class="btn" id="again">Παίξε ξανά (νέοι γρίφοι)</button></div></div>`;
  confetti(180);
  $("#again").onclick=()=>{reset();render()};
}

/* ========== CONFETTI ========== */
const cv=$("#confetti"),cx=cv.getContext("2d");let parts=[],anim=null;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function fit(){cv.width=innerWidth;cv.height=innerHeight}addEventListener("resize",fit);fit();
function confetti(n){
  if(reduce)return;
  const cols=["#8e7cc3","#7aa6b9","#6fae84","#c98bb0","#c6a75e"];
  for(let i=0;i<n;i++)parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.2,s:6+Math.random()*7,c:cols[i%5]});
  if(!anim)tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
  parts=parts.filter(p=>p.y<cv.height+30);
  anim=parts.length?requestAnimationFrame(tick):null;if(!anim)cx.clearRect(0,0,cv.width,cv.height);
}

render();
</script>
